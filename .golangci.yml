version: "2"
run:
  tests: true
linters:
  enable:
    - asciicheck
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - funlen
    - goconst
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - predeclared
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  disable:
    - dupl
    - gocyclo
    - lll
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    godot:
      scope: all
      capital: true
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: vendor/
      - linters:
          - forbidigo
        path: cmd/
        text: use of fmt.Print
      - linters:
          - godox
        text: TODO
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/eshaffer321/walmart-client-go/v2
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
